[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicml"
version = "0.1.0"
description = "Music analysis module: structure segmentation + emotion recognition"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]
web = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",
]
panns = [
    "panns-inference>=0.1.1",
]
ast = [
    "transformers>=4.30",
]

[tool.setuptools.packages.find]
include = ["musicml*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Config 3: PANNs pretrained embeddings + Linear per-window model
# Tests hypothesis: pretrained features alone improve quality

architecture: "panns_linear"
embedding_source: "panns_embeddings"  # subfolder name in data dirs
sequence_mode: false

audio:
  sr: 22050
  mono: true

features:
  mode: "log_mel"
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  n_mels: 128
  fmin: 30.0
  fmax: null

windowing:
  window_seconds: 10.0
  hop_seconds: 1.0

model:
  embedding_dim: 2048       # PANNs CNN14 output dimension
  projection_dim: 512       # projection layer
  head_dropout: 0.4
  n_segment_classes: 6
  n_arousal_classes: 3
  n_valence_classes: 3
  n_genre_classes: 10
  enable_regression: true

training:
  seed: 42
  lr: 1.0e-3
  weight_decay: 5.0e-4
  batch_size: 64            # large batch for per-window
  epochs: 50
  early_stopping_patience: 15
  scheduler: onecycle
  loss_type: focal
  focal_gamma: 1.5
  mixup_alpha: 0.2          # mixup works for per-window
  max_class_weight: 2.5

loss_weights:
  segment: 1.5
  arousal_cls: 1.0
  valence_cls: 1.0
  arousal_reg: 0.5
  valence_reg: 0.5
  genre: 1.0

postprocess:
  smooth_kernel: 5
  min_segment_duration: 4.0

segment_classes:
  - Intro
  - Verse
  - Bridge
  - Chorus
  - Instrumental
  - Outro

arousal_classes:
  - Low
  - Mid
  - High

valence_classes:
  - Dark
  - Neutral
  - Bright

genre_classes:
  - blues
  - classical
  - country
  - disco
  - hiphop
  - jazz
  - metal
  - pop
  - reggae
  - rock

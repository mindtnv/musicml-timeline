# CNN v3 — targeted improvement of segment-head accuracy.
#
# Problem:
#   Current CNN v2 gets ~35% val acc on segment classification, the
#   weakest of the 4 heads. The model consistently over-predicts Chorus
#   and under-predicts Verse because of class imbalance in Harmonix.
#
# Changes vs default.yaml:
#   * segment loss weight 1.5 → 3.5 (emphasize this hard task)
#   * focal_gamma 1.5 → 2.5 (focus on hard / low-confidence frames)
#   * max_class_weight 2.5 → 3.5 (stronger inverse-frequency reweighting
#     so Verse / Instrumental get attention)
#   * slightly longer warm-restart period for smoother convergence
#
# Expected: +3..7 pp segment acc / +5..10 pp boundary F1.
# Everything else should stay within ±1 pp.

audio:
  sr: 22050
  mono: true

features:
  mode: "log_mel"
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  n_mels: 128
  fmin: 30.0
  fmax: null
  n_mfcc: 20

windowing:
  window_seconds: 10.0
  hop_seconds: 1.0

model:
  in_channels: 1
  n_segment_classes: 6
  n_arousal_classes: 3
  n_valence_classes: 3
  dropout: 0.4
  backbone_dropout: 0.25
  enable_regression: true
  n_genre_classes: 10

training:
  seed: 42
  lr: 1.0e-3
  weight_decay: 5.0e-4
  batch_size: 64
  epochs: 50
  early_stopping_patience: 15
  scheduler: cosine_warm_restarts
  loss_type: focal
  focal_gamma: 2.5              # up from 1.5 — focus on hard examples
  mixup_alpha: 0.2
  max_class_weight: 3.5         # up from 2.5 — stronger reweighting for rare classes

spec_augment:
  freq_mask: 27
  time_mask: 60
  n_masks: 2

loss_weights:
  segment: 3.5                  # up from 1.5 — emphasize structure task
  arousal_cls: 1.0
  valence_cls: 1.0
  arousal_reg: 0.5
  valence_reg: 0.5
  genre: 1.0

postprocess:
  smooth_kernel: 5
  min_segment_duration: 4.0
  use_viterbi: true
  transition_penalty: 1.0
  use_position_priors: true
  smooth_kernel_segment: 5
  min_segment_duration_segment: 6.0

segment_classes:
  - Intro
  - Verse
  - Bridge
  - Chorus
  - Instrumental
  - Outro

arousal_classes:
  - Low
  - Mid
  - High

valence_classes:
  - Dark
  - Neutral
  - Bright

genre_classes:
  - blues
  - classical
  - country
  - disco
  - hiphop
  - jazz
  - metal
  - pop
  - reggae
  - rock

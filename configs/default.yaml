audio:
  sr: 22050
  mono: true

features:
  mode: "log_mel"  # "log_mel" or "log_mel_chroma"
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  n_mels: 128
  fmin: 30.0
  fmax: null  # sr / 2
  n_mfcc: 20

windowing:
  window_seconds: 10.0
  hop_seconds: 1.0

model:
  in_channels: 1
  n_segment_classes: 6
  n_arousal_classes: 3
  n_valence_classes: 3
  dropout: 0.4
  backbone_dropout: 0.25
  enable_regression: true
  n_genre_classes: 10    # 0 to disable

training:
  seed: 42
  lr: 1.0e-3
  weight_decay: 5.0e-4
  batch_size: 64
  epochs: 50
  early_stopping_patience: 15
  scheduler: cosine_warm_restarts  # "cosine", "onecycle", or "cosine_warm_restarts"
  loss_type: focal         # "cross_entropy" or "focal"
  focal_gamma: 1.5
  mixup_alpha: 0.2         # 0.0 to disable
  max_class_weight: 2.5

spec_augment:
  freq_mask: 27
  time_mask: 60
  n_masks: 2

loss_weights:
  segment: 1.5
  arousal_cls: 1.0
  valence_cls: 1.0
  arousal_reg: 0.5
  valence_reg: 0.5
  genre: 1.0

postprocess:
  # Basic settings (all heads)
  smooth_kernel: 5
  min_segment_duration: 4.0

  # Segment head decoder — "v2" (default, algorithmic improvements) or "v1"
  segment_decoder: v2

  # --- v2 parameters ---
  # Temperature for probs before Viterbi (1.0 = off; >1 softens).
  v2_temperature: 1.0
  # Base cost for any class transition not listed in the structural matrix.
  v2_base_transition_penalty: 1.2
  # Intro is forced to live in the first `boundary_fraction` of the track,
  # Outro in the last `boundary_fraction`. Smaller => stricter.
  v2_boundary_fraction: 0.18
  # Log-prior penalty for Intro/Outro outside their allowed zone.
  v2_position_penalty: 10.0
  # Small positive log-prior that actively prefers Intro near start /
  # Outro near end (over the neutral Verse/Chorus classes).
  v2_position_boost: 0.7
  # Snap each boundary to nearest local max of the novelty curve within
  # +/- this many seconds. 0 disables snapping.
  v2_novelty_snap_radius_sec: 2.0
  v2_per_class_min_duration_sec:
    Intro: 3.0
    Verse: 6.0
    Bridge: 3.0
    Chorus: 6.0
    Instrumental: 6.0
    Outro: 3.0

  # Blend Foote-style audio novelty (from log-mel self-similarity) with
  # probability novelty when snapping boundaries. 0 = probs only, 1 = audio only.
  # Needs raw log-mel features to be passed; falls back to 0 automatically.
  v2_audio_novelty_weight: 0.6
  # Repetition consistency: if two spans are acoustically similar, force them
  # to share a label (usually Chorus). Needs raw log-mel features.
  v2_enable_repetition: true
  v2_repetition_min_section_sec: 8.0
  v2_repetition_similarity_threshold: 0.82

  # --- v1 parameters (used when segment_decoder: v1) ---
  use_viterbi: true
  transition_penalty: 1.0
  use_position_priors: true
  smooth_kernel_segment: 5
  min_segment_duration_segment: 6.0

segment_classes:
  - Intro
  - Verse
  - Bridge
  - Chorus
  - Instrumental
  - Outro

arousal_classes:
  - Low
  - Mid
  - High

valence_classes:
  - Dark
  - Neutral
  - Bright

genre_classes:
  - blues
  - classical
  - country
  - disco
  - hiphop
  - jazz
  - metal
  - pop
  - reggae
  - rock

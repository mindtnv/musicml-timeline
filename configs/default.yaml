audio:
  sr: 22050
  mono: true

features:
  mode: "log_mel"  # "log_mel" or "log_mel_chroma"
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  n_mels: 128
  fmin: 30.0
  fmax: null  # sr / 2
  n_mfcc: 20

windowing:
  window_seconds: 10.0
  hop_seconds: 1.0

model:
  in_channels: 1
  n_segment_classes: 6
  n_arousal_classes: 3
  n_valence_classes: 3
  dropout: 0.4
  backbone_dropout: 0.25
  enable_regression: true
  n_genre_classes: 10    # 0 to disable

training:
  seed: 42
  lr: 1.0e-3
  weight_decay: 5.0e-4
  batch_size: 64
  epochs: 50
  early_stopping_patience: 15
  scheduler: cosine_warm_restarts  # "cosine", "onecycle", or "cosine_warm_restarts"
  loss_type: focal         # "cross_entropy" or "focal"
  focal_gamma: 1.5
  mixup_alpha: 0.2         # 0.0 to disable
  max_class_weight: 2.5

spec_augment:
  freq_mask: 27
  time_mask: 60
  n_masks: 2

loss_weights:
  segment: 1.5
  arousal_cls: 1.0
  valence_cls: 1.0
  arousal_reg: 0.5
  valence_reg: 0.5
  genre: 1.0

postprocess:
  # Basic settings (all heads)
  smooth_kernel: 5
  min_segment_duration: 4.0
  # Segment head — Viterbi + position priors + aggressive smoothing
  use_viterbi: true
  transition_penalty: 1.0            # smaller => more transitions allowed
  use_position_priors: true          # Intro only at start, Outro only at end
  smooth_kernel_segment: 5           # post-Viterbi median filter
  min_segment_duration_segment: 6.0

segment_classes:
  - Intro
  - Verse
  - Bridge
  - Chorus
  - Instrumental
  - Outro

arousal_classes:
  - Low
  - Mid
  - High

valence_classes:
  - Dark
  - Neutral
  - Bright

genre_classes:
  - blues
  - classical
  - country
  - disco
  - hiphop
  - jazz
  - metal
  - pop
  - reggae
  - rock

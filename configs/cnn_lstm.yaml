# Config 2: CNN embeddings + BiLSTM temporal model
# Tests hypothesis: adding temporal context to CNN features improves quality

architecture: "cnn_lstm"
embedding_source: "cnn_embeddings"    # subfolder name in data dirs
sequence_mode: true
cnn_backbone_ckpt: "checkpoints/last.pt"  # CNN checkpoint for inference

audio:
  sr: 22050
  mono: true

features:
  mode: "log_mel"
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  n_mels: 128
  fmin: 30.0
  fmax: null

windowing:
  window_seconds: 10.0
  hop_seconds: 1.0

model:
  embedding_dim: 512        # CNN backbone output dimension (upgraded)
  projection_dim: 256       # projection for 512-dim input
  lstm_hidden: 128          # BiLSTM: 128*2 = 256 total
  lstm_layers: 2
  lstm_dropout: 0.3
  head_dropout: 0.4
  n_segment_classes: 6
  n_arousal_classes: 3
  n_valence_classes: 3
  n_genre_classes: 10
  enable_regression: true

training:
  seed: 42
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 16            # smaller batch for sequences
  epochs: 50
  early_stopping_patience: 15
  scheduler: onecycle
  loss_type: focal
  focal_gamma: 1.5
  mixup_alpha: 0.0          # no mixup for sequences
  max_class_weight: 2.5

loss_weights:
  segment: 1.5
  arousal_cls: 1.0
  valence_cls: 1.0
  arousal_reg: 0.5
  valence_reg: 0.5
  genre: 1.0

postprocess:
  smooth_kernel: 5
  min_segment_duration: 4.0

segment_classes:
  - Intro
  - Verse
  - Bridge
  - Chorus
  - Instrumental
  - Outro

arousal_classes:
  - Low
  - Mid
  - High

valence_classes:
  - Dark
  - Neutral
  - Bright

genre_classes:
  - blues
  - classical
  - country
  - disco
  - hiphop
  - jazz
  - metal
  - pop
  - reggae
  - rock

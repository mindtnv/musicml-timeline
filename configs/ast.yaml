# Config 5: Audio Spectrogram Transformer (pretrained on AudioSet)
# Tests hypothesis: pretrained transformer backbone significantly improves all tasks

architecture: "ast"

audio:
  sr: 22050
  mono: true

features:
  mode: "log_mel"
  n_fft: 2048
  hop_length: 512
  win_length: 2048
  n_mels: 128
  fmin: 30.0
  fmax: null

windowing:
  window_seconds: 10.0
  hop_seconds: 1.0              # full resolution for proper fine-tuning

model:
  pretrained_model: "MIT/ast-finetuned-audioset-10-10-0.4593"
  freeze_layers: 8            # freeze first 8 of 12 transformer layers (4 unfrozen for better adaptation)
  hidden_dim: 768             # AST output dimension
  shared_fc_dim: 256          # projection before heads
  dropout: 0.3                # less dropout for pretrained model
  n_segment_classes: 6
  n_arousal_classes: 3
  n_valence_classes: 3
  n_genre_classes: 10
  enable_regression: true

training:
  seed: 42
  lr: 5.0e-5                  # low LR for pretrained backbone
  lr_head: 1.0e-3             # high LR for heads (differential)
  weight_decay: 0.01
  batch_size: 16              # smaller batch, use grad accumulation for effective batch=64
  grad_accumulation_steps: 4  # effective batch = 16*4 = 64
  epochs: 8                   # sufficient with full data (hop=1.0)
  early_stopping_patience: 3
  scheduler: cosine_warm_restarts
  loss_type: focal
  focal_gamma: 1.5
  mixup_alpha: 0.0            # no mixup for transformer
  max_class_weight: 2.5

loss_weights:
  segment: 1.5
  arousal_cls: 1.0
  valence_cls: 1.0
  arousal_reg: 0.5
  valence_reg: 0.5
  genre: 1.0

spec_augment:
  freq_mask: 20
  time_mask: 60
  n_masks: 2

postprocess:
  # Basic settings (all heads)
  smooth_kernel: 5
  min_segment_duration: 4.0
  # Segment head — Viterbi + position priors + aggressive smoothing
  segment_decoder: v2
  use_viterbi: true
  transition_penalty: 1.0
  use_position_priors: true
  smooth_kernel_segment: 5
  min_segment_duration_segment: 6.0
  # v2 decoder — tuned 2026-04-21 against TikTok + Just Dance
  v2_temperature: 1.4
  v2_base_transition_penalty: 2.0
  v2_position_penalty: 8.0
  v2_position_boost: 2.5
  v2_boundary_fraction: 0.10
  v2_min_boundary_sec: 20.0          # absolute minimum Outro zone size
  v2_novelty_snap_radius_sec: 2.0
  v2_audio_novelty_weight: 0.6
  v2_enable_repetition: true
  v2_repetition_min_section_sec: 8.0
  v2_repetition_similarity_threshold: 0.82
  v2_ensure_outro_tail: true
  v2_outro_tail_search_sec: 30.0
  v2_outro_tail_prob_threshold: 0.15
  v2_outro_tail_force_position_fraction: 0.94
  v2_per_class_min_duration_sec:
    Intro: 4.0
    Verse: 8.0
    Bridge: 6.0
    Chorus: 8.0
    Instrumental: 8.0
    Outro: 3.0

segment_classes:
  - Intro
  - Verse
  - Bridge
  - Chorus
  - Instrumental
  - Outro

arousal_classes:
  - Low
  - Mid
  - High

valence_classes:
  - Dark
  - Neutral
  - Bright

genre_classes:
  - blues
  - classical
  - country
  - disco
  - hiphop
  - jazz
  - metal
  - pop
  - reggae
  - rock
